<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oxi Fresh NE Florida — 2026 Technician Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bd:#0c2461;--bl:#1e3799;--red:#c0392b;--gd:#f5c518;--sv:#b0bcd8;--bz:#d4956a;--bg:#f4f6fb;--wh:#fff;--tx:#1a2a4a;--mu:#8a9ab8;--br:#e2e8f5;}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}

/* HEADER */
.hdr{background:linear-gradient(135deg,#0c2461 0%,#1e3799 55%,#c0392b 100%);padding:18px 24px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(12,36,97,.25);}
.hdr::before{content:'';position:absolute;top:-40px;right:-30px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06);}
.lbox{background:#fff;border-radius:12px;padding:8px 14px;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.2);position:relative;z-index:1;}
.htxt{flex:1;position:relative;z-index:1;}
.ht1{color:#fff;font-size:18px;font-weight:900;text-shadow:0 1px 6px rgba(0,0,0,.3);}
.ht2{color:rgba(255,255,255,.82);font-size:13px;font-weight:500;margin-top:3px;}
.hbdg{background:linear-gradient(135deg,#f9ca24,#f0932b);border-radius:20px;padding:4px 14px;font-size:11px;font-weight:700;color:#fff;margin-top:7px;display:inline-block;}
.hdt{color:rgba(255,255,255,.65);font-size:11px;margin-top:4px;}
.main{max-width:1200px;margin:0 auto;padding:20px 16px 48px;}

/* TAB BAR */
.tbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 10px rgba(12,36,97,.08);border:1px solid var(--br);}
.tbtn{padding:7px 14px;border-radius:25px;border:1.5px solid var(--br);background:transparent;font-size:12px;font-weight:600;color:var(--mu);cursor:pointer;font-family:'Poppins',sans-serif;transition:all .18s;}
.tbtn:hover:not(.active){background:#f0f4ff;border-color:var(--bl);color:var(--bl);}
.tbtn.active{background:linear-gradient(135deg,var(--bd),var(--bl));color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(12,36,97,.3);}
.tbtn.kpi.active{background:linear-gradient(135deg,#6c3483,#8e44ad);box-shadow:0 3px 12px rgba(108,52,131,.3);}
.tbtn.tech-robert.active{background:linear-gradient(135deg,#1a3a8f,#2955d4);box-shadow:0 3px 12px rgba(26,58,143,.35);}
.tbtn.tech-evan.active{background:linear-gradient(135deg,#0a5c38,#0d7a4b);box-shadow:0 3px 12px rgba(10,92,56,.35);}
.tbtn.tech-brad.active{background:linear-gradient(135deg,#8b1a0a,#c0392b);box-shadow:0 3px 12px rgba(139,26,10,.35);}
.tbtn.tech-troy.active{background:linear-gradient(135deg,#5b2c6f,#7d3c98);box-shadow:0 3px 12px rgba(93,44,111,.35);}

/* SCORECARD */
.prow{display:flex;gap:12px;margin-bottom:18px;}
.pc{flex:1;border-radius:16px;padding:16px 12px;text-align:center;transition:transform .2s,box-shadow .2s;cursor:default;}
.pc:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12);}
.pc.g{background:linear-gradient(135deg,#fff9e0,#fef5c3);border:2px solid var(--gd);}
.pc.s{background:linear-gradient(135deg,#f4f6fb,#e8ecf5);border:2px solid var(--sv);}
.pc.b{background:linear-gradient(135deg,#fff8f2,#fdebd0);border:2px solid var(--bz);}
.pc.p4{background:linear-gradient(135deg,#faf0ff,#f0e6f8);border:2px solid #c39bd3;}
.pm{font-size:28px;margin-bottom:6px;}
.pav{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;margin:0 auto 8px;border:3px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.15);}
.pnm{font-size:14px;font-weight:800;color:var(--tx);margin-bottom:4px;}
.ppt{font-size:28px;font-weight:900;margin:4px 0 2px;line-height:1;}
.g .ppt{color:#b8860b;}.s .ppt{color:#5a6a8a;}.b .ppt{color:#9c3a00;}
.p4 .ppt{color:#6c3483;}
.plb{font-size:10px;color:var(--mu);font-weight:600;text-transform:uppercase;}
.note{font-size:12px;color:#5a6a8a;margin-bottom:14px;padding:9px 14px;background:linear-gradient(135deg,#f0f4ff,#e8f0fe);border-radius:10px;border-left:3px solid var(--bl);}
.sw{overflow-x:auto;border-radius:14px;box-shadow:0 2px 14px rgba(12,36,97,.08);}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:14px;overflow:hidden;}
th{padding:9px 10px;font-weight:700;font-size:10px;color:#fff;text-align:center;white-space:nowrap;}
th:first-child{text-align:left;}
td{padding:10px;text-align:center;border-bottom:1px solid #eef0f8;font-size:12px;white-space:nowrap;}
td:first-child{text-align:left;font-weight:700;font-size:13px;}
tbody tr:hover td{background:#f8faff!important;}
tbody tr:last-child td{border-bottom:none;}
.rr td{background:linear-gradient(90deg,#eef3ff,#fff);}
.re td{background:linear-gradient(90deg,#eaf5ee,#fff);}
.rb td{background:linear-gradient(90deg,#fff5f0,#fff);}
.rt td{background:linear-gradient(90deg,#f8f0ff,#fff);}
.pc2{font-weight:700;color:var(--bl);}
.rkg{background:#fff3cd;color:#856404;font-weight:800;border-radius:6px;padding:2px 8px;}
.rks{background:#e9ecef;color:#495057;font-weight:800;border-radius:6px;padding:2px 8px;}
.rkb{background:#ffe8d6;color:#8a3a00;font-weight:800;border-radius:6px;padding:2px 8px;}
.rkp4{background:#f5e8ff;color:#6c3483;font-weight:800;border-radius:6px;padding:2px 8px;}
.ndc{color:#bbb;font-style:italic;}

/* KPI TAB */
.kbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 10px rgba(12,36,97,.08);border:1px solid var(--br);}
.kbtn{padding:6px 12px;border-radius:20px;border:1.5px solid var(--br);background:transparent;font-size:11px;font-weight:600;color:var(--mu);cursor:pointer;font-family:'Poppins',sans-serif;transition:all .15s;}
.kbtn:hover:not(.active){background:#f5f0ff;border-color:#8e44ad;color:#6c3483;}
.kbtn.active{background:linear-gradient(135deg,#6c3483,#8e44ad);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(108,52,131,.3);}
.kmb{margin-bottom:22px;}
.kmh{font-size:14px;font-weight:800;color:var(--tx);margin-bottom:10px;padding:8px 16px;background:linear-gradient(135deg,#f0f4ff,#e8eeff);border-radius:10px;border-left:4px solid var(--bl);}
.kpod{display:flex;gap:10px;}
.tp{flex:1;border-radius:14px;padding:12px 8px;text-align:center;transition:transform .18s,box-shadow .18s;cursor:default;}
.tp:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.1);}
.tp.g{background:linear-gradient(135deg,#fff9e0,#fef5c3);border:2px solid var(--gd);}
.tp.s{background:linear-gradient(135deg,#f4f6fb,#e8ecf5);border:2px solid var(--sv);}
.tp.b{background:linear-gradient(135deg,#fff8f2,#fdebd0);border:2px solid var(--bz);}
.tp.p4{background:linear-gradient(135deg,#faf0ff,#f0e6f8);border:2px solid #c39bd3;}
.tp.em{background:#f8f9fa;border:1.5px dashed #dde3f0;opacity:.35;}
.tav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin:0 auto 5px;}
.tnm{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:3px;}
.tvl{font-size:20px;font-weight:900;margin:4px 0 2px;line-height:1;}
.g .tvl{color:#b8860b;}.s .tvl{color:#5a6a8a;}.b .tvl{color:#9c3a00;}
.p4 .tvl{color:#6c3483;}
.tun{font-size:9px;color:var(--mu);font-weight:500;margin-bottom:8px;}
.tbl{border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;font-size:24px;margin-top:8px;}

/* TECHNICIAN PROFILE */
.tp-hero{border-radius:18px;padding:20px 24px;margin-bottom:18px;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden;}
.tp-av-big{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;border:4px solid rgba(255,255,255,.85);box-shadow:0 4px 16px rgba(0,0,0,.18);flex-shrink:0;}
.tp-info{flex:1;}
.tp-name{font-size:22px;font-weight:900;margin-bottom:4px;}
.tp-sub{font-size:12px;font-weight:500;opacity:.75;margin-bottom:10px;}
.tp-badges{display:flex;gap:8px;flex-wrap:wrap;}
.tp-badge{border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;background:rgba(255,255,255,.2);backdrop-filter:blur(4px);}
.tp-ytd-score{text-align:center;background:rgba(255,255,255,.15);border-radius:14px;padding:12px 18px;flex-shrink:0;backdrop-filter:blur(4px);}
.tp-ytd-num{font-size:36px;font-weight:900;line-height:1;}
.tp-ytd-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;opacity:.8;margin-top:2px;}

/* KPI CARDS GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:18px;}
.kpi-card{background:#fff;border-radius:14px;padding:14px 12px;text-align:center;border:1.5px solid var(--br);box-shadow:0 2px 8px rgba(12,36,97,.06);transition:transform .15s;}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(12,36,97,.1);}
.kpi-card-icon{font-size:20px;margin-bottom:6px;}
.kpi-card-label{font-size:10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px;}
.kpi-card-val{font-size:20px;font-weight:900;margin-bottom:2px;}
.kpi-card-pts{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;display:inline-block;margin-top:2px;}

/* MONTHLY TABLE for technician */
.month-table-wrap{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(12,36,97,.08);overflow:hidden;margin-bottom:18px;}
.month-table-title{font-size:13px;font-weight:800;color:var(--tx);padding:12px 16px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:8px;}
.mt{width:100%;border-collapse:collapse;font-size:12px;}
.mt th{padding:9px 12px;font-weight:700;font-size:10px;color:#fff;text-align:center;white-space:nowrap;}
.mt td{padding:9px 12px;text-align:center;border-bottom:1px solid #eef0f8;font-size:12px;}
.mt td:first-child{text-align:left;font-weight:700;}
.mt tbody tr:last-child td{border-bottom:none;background:#f0f4ff;font-weight:700;}
.mt tbody tr:hover td{background:#f8faff;}
.pts-hi{color:#1e3799;font-weight:800;}
.pts-lo{color:#c0392b;font-weight:600;}
.pts-mid{color:#0a7a4b;font-weight:700;}

.dn{display:none;}
.ftr{text-align:center;color:var(--mu);font-size:11px;margin-top:32px;padding-top:16px;border-top:1px solid var(--br);}

/* PRINT BUTTON */
.print-bar{display:flex;justify-content:flex-end;margin-bottom:12px;}
.print-btn{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:25px;border:none;background:linear-gradient(135deg,#0c2461,#1e3799);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;box-shadow:0 3px 12px rgba(12,36,97,.3);transition:all .18s;}
.print-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(12,36,97,.4);}
.print-btn svg{width:16px;height:16px;fill:#fff;}

/* ── PRINT STYLES ── */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: #fff !important; margin: 0; padding: 0; font-size: 10pt; }
  .print-bar, .tbar, .kbar, .ftr, .hdt { display: none !important; }
  .main { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
  .hdr {
    background: linear-gradient(135deg,#0c2461,#1e3799,#c0392b) !important;
    padding: 12px 16px !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    margin-bottom: 14px;
    page-break-inside: avoid;
  }
  .ht1 { font-size: 14pt !important; }
  .ht2 { font-size: 9pt !important; }
  .hbdg { font-size: 8pt !important; }
  /* Podium */
  .prow { gap: 8px !important; margin-bottom: 12px !important; page-break-inside: avoid; }
  .pc { padding: 10px 8px !important; border-radius: 8px !important; }
  .pm { font-size: 20px !important; margin-bottom: 3px !important; }
  .pav { width: 38px !important; height: 38px !important; font-size: 12px !important; }
  .pnm { font-size: 10pt !important; }
  .ppt { font-size: 20pt !important; }
  /* Tables */
  .sw { box-shadow: none !important; border-radius: 4px !important; overflow: visible !important; }
  table { font-size: 8pt !important; border-radius: 0 !important; page-break-inside: auto; }
  th { padding: 6px 6px !important; font-size: 7.5pt !important; }
  td { padding: 6px 6px !important; font-size: 8pt !important; }
  tbody tr { page-break-inside: avoid; }
  /* Note box */
  .note { font-size: 8pt !important; padding: 6px 10px !important; margin-bottom: 10px !important; }
  /* KPI podium view */
  .kmb { margin-bottom: 14px !important; page-break-inside: avoid; }
  .kmh { font-size: 10pt !important; padding: 5px 10px !important; margin-bottom: 7px !important; }
  .kpod { gap: 6px !important; }
  .tp { padding: 8px 5px !important; border-radius: 8px !important; }
  .tav { width: 28px !important; height: 28px !important; font-size: 9px !important; }
  .tnm { font-size: 8pt !important; }
  .tvl { font-size: 13pt !important; }
  .tun { font-size: 7pt !important; }
  .tbl { font-size: 18px !important; }
  /* Tech profile */
  .tp-hero { border-radius: 8px !important; padding: 12px 16px !important; margin-bottom: 12px !important; page-break-inside: avoid; }
  .tp-av-big { width: 52px !important; height: 52px !important; font-size: 16px !important; }
  .tp-name { font-size: 16pt !important; }
  .tp-sub { font-size: 8pt !important; }
  .tp-ytd-num { font-size: 26pt !important; }
  .month-table-wrap { box-shadow: none !important; border-radius: 4px !important; border: 1px solid #dde3f0; }
  .month-table-title { font-size: 9pt !important; padding: 8px 12px !important; }
  .mt th { padding: 5px 6px !important; font-size: 7pt !important; }
  .mt td { padding: 5px 6px !important; font-size: 8pt !important; }
  /* Print header on each page */
  .print-page-title { display: block !important; font-size: 9pt; color: #8a9ab8; text-align: center; padding-bottom: 6px; border-bottom: 1px solid #e2e8f5; margin-bottom: 10px; }
  /* Row backgrounds — force print */
  .rr td { background: #eef3ff !important; }
  .re td { background: #eaf5ee !important; }
  .rb td { background: #fff5f0 !important; }
  .pc.g { background: #fff9e0 !important; }
  .pc.s { background: #f4f6fb !important; }
  .pc.b { background: #fff8f2 !important; }
  .tp.g { background: #fff9e0 !important; }
  .tp.s { background: #f4f6fb !important; }
  .tp.b { background: #fff8f2 !important; }
}

@media(max-width:640px){
  .hdr{padding:14px;gap:12px;}.ht1{font-size:14px;}.ppt{font-size:22px;}
  th,td{padding:7px 5px;font-size:10px;}.kpod{gap:6px;}.tp{padding:10px 5px;}.tvl{font-size:16px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .tp-hero{flex-wrap:wrap;}
}
</style>
</head>

      var d=DATA[name][mi2];
      if(!d)continue;
      var mp=MPTS[mi2]?MPTS[mi2][name]:{total:0,google:0,sms:0,l360:0,upsell:0,attend:0};
      monthRows+='<tr>'
        +'<td style="font-weight:700;color:'+cl.c+'">'+MN[mi2]+'</td>'
        +'<td>'+fn(d[0],0)+'</td>'
        +'<td>'+fp(d[1])+'</td>'

        +'<td style="font-weight:900;color:'+cl.c+';font-size:14px;">'+mp.total+'</td>'
        +'</tr>';
    }

    // YTD row
    var yp=YTDP[name];
    var yd=YTD[name];
    monthRows+='<tr style="background:'+cl.light+'!important;">'
      +'<td style="font-weight:800;color:'+cl.c+';">YTD</td>'
      +'<td>'+fn(yd[0],0)+'</td>'
      +'<td>'+fp(yd[1])+'</td>'
      +'<td>'+fn(yd[2],0)+'</td>'
      +'<td class="'+ptsColor(yp.l360)+'">'+yp.l360+'</td>'
      +'<td>'+fp(yd[5])+'</td>'
      +'<td class="'+ptsColor(yp.upsell)+'">'+yp.upsell+'</td>'
      +'<td>'+fn(yd[6],0)+'</td>'
      +'<td>'+fp(yd[7])+'</td>'
      +'<td>'+fn(yd[8],2)+'</td>'
      +'<td class="'+ptsColor(yp.google)+'">'+yp.google+'</td>'
      +'<td>'+fn(yd[9],0)+'</td>'
      +'<td>'+fp(yd[10])+'</td>'
      +'<td>'+fn(yd[11],2)+'</td>'
      +'<td class="'+ptsColor(yp.sms)+'">'+yp.sms+'</td>'
      +'<td>'+fn(yd[12],2)+'</td>'
      +'<td class="'+ptsColor(yp.attend)+'">'+yp.attend+'</td>'
      +'<td style="font-weight:900;color:'+cl.c+';font-size:14px;">'+yp.total+'</td>'
      +'</tr>';
  }

  var monthlyTable='<div class="month-table-wrap">'
    +'<div class="month-table-title" style="border-left:4px solid '+cl.c+';">📅 Monthly KPI Breakdown — Jan to Sep 2026</div>'
    +'<div style="overflow-x:auto;"><table class="mt"><thead><tr>'
    +'<th style="background:'+cl.c+';text-align:left;min-width:52px;">Month</th>'
    +'<th colspan="4" style="background:#185090;">Listen 360</th>'
    +'<th colspan="2" style="background:#1a6b3a;">Upsell</th>'
    +'<th colspan="4" style="background:#8b1a1a;">Google Review</th>'
    +'<th colspan="4" style="background:#5b2c8d;">SMS Rating</th>'
    +'<th colspan="2" style="background:#7d6608;">GPS</th>'
    +'<th style="background:'+cl.c+';">Total</th>'
    +'</tr><tr>'
    +'<th style="background:'+cl.c+'"></th>'
    +'<th style="background:#185090;">Count</th><th style="background:#185090;">Resp%</th><th style="background:#185090;">NPS</th><th style="background:#185090;color:#ffd700;">Pts</th>'
    +'<th style="background:#1a6b3a;">%</th><th style="background:#1a6b3a;color:#ffd700;">Pts</th>'
    +'<th style="background:#8b1a1a;">Count</th><th style="background:#8b1a1a;">Resp%</th><th style="background:#8b1a1a;">Ave★</th><th style="background:#8b1a1a;color:#ffd700;">Pts</th>'
    +'<th style="background:#5b2c8d;">Count</th><th style="background:#5b2c8d;">Resp%</th><th style="background:#5b2c8d;">Ave★</th><th style="background:#5b2c8d;color:#ffd700;">Pts</th>'
    +'<th style="background:#7d6608;">Score</th><th style="background:#7d6608;color:#ffd700;">Pts</th>'
    +'<th style="background:'+cl.c+'"></th>'

  tv.innerHTML=hero+cards+monthlyTable;
}
